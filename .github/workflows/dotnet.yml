# ライブラリのビルドとテスト。テストはネットワークに接続しない。
name: dotnet

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Twikit.sln
      - run: dotnet build Twikit.sln -c Release --no-restore
      - run: dotnet test tests/Twikit.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Check that the DocFX site builds
        run: |
          dotnet tool update -g docfx
          docfx docs/docfx.json
